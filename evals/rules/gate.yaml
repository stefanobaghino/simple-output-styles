# The gate policy: the pass threshold per style.
#
# The thresholds live outside the rule files on purpose. A threshold edit
# changes only the pass mark, never the measured rate. The rule-file hash
# thus keeps answering the question "did the measured quantity change?".
#
# A pair passes when its styled answer has at least one sentence and a
# violation rate at or below max_rate per 100 sentences. The thresholds
# differ per style, because the rule counts differ and thus the rates are
# not comparable across styles.
#
# Calibrated against runs/2026-08-01b. The pass marks of that run carry
# a one-time asterisk: the same data set the thresholds and took the
# test. Later runs are gated by these pre-committed values.
#
# technical-simplified: the styled rates were 12 zeros, then 3.2 to 12.5
#   (one violation each, the rate depends on the answer length), then
#   22.2 and above (2 to 4 violations). The baseline rates started at
#   16.7. The threshold 15.0 sits in the gap: one violation passes at
#   any answer length, 2 or more violations fail, and every nonzero
#   baseline rate fails.
# plain-language: the styled rates were all zero. The baseline rates
#   started at 8.3. The threshold 5.0 sits below the baseline floor and
#   grants slack for one violation in an answer of 20 or more sentences.
#
# classic-concise, clarity-flow, developer-docs: calibrated against
#   runs/2026-08-07, the calibration run of #79 p2. That run carries
#   the same one-time asterisk. Unlike the first two styles, their
#   baseline floors sit low, so a threshold under every nonzero
#   baseline rate is not attainable; the baseline carries no mark, so
#   the thresholds aim at the styled rates and the baseline mass.
#
# classic-concise: the styled rates were 30 zeros, then 2.7 and 4.2
#   (one violation each). The baseline rates started at 2.0. The
#   threshold 10.0 keeps the observed styled rates with headroom,
#   passes one violation at 10 or more sentences, and fails the
#   baseline tail from 12.9.
# clarity-flow: the styled rates and the baseline rates were all
#   zero: the rule set separated nothing in this run. The threshold
#   5.0 mirrors plain-language: strict, with slack for one violation
#   in an answer of 20 or more sentences.
# developer-docs: the styled rates were 31 zeros and one 6.2. The
#   baseline rates started at 2.6, with 11 of 20 nonzero rates at
#   11.1 or above. The threshold 10.0 passes the observed styled
#   rate with headroom and fails that upper half of the baseline.
#
# actionable-clarity: the candidate style of the #83 design loop.
#   Calibrated against runs/2026-08-10-screening, which carries the
#   one-time asterisk. The styled rates were 8 zeros and the baseline
#   rate was 10.22, so the threshold 5.0 mirrors plain-language:
#   strict, with slack for one violation in an answer of 20 or more
#   sentences. The screening sample is 8 pairs, so the confirmation
#   campaign re-checks this calibration. The re-check held: the styled
#   rates of the confirmation runs (runs/2026-08-10d to f) were 0.17,
#   0.68, and 0.0, and the held-out run measured 0.41, all far under
#   5.0. One pair per run failed the gate in two of those runs — a
#   single violation in a short answer clears 5.0 per pair — and the
#   exclusions are the gate working, not a calibration miss.
# concise: the Claude Code built-in style, added with the CLI pin move
#   to 2.1.239. No measured rates exist yet. The rule set is a small
#   strict pattern set like plain-language, so the provisional
#   threshold 5.0 mirrors it: strict, with slack for one violation in
#   an answer of 20 or more sentences. Calibrate against the first
#   campaign run of the 2.1.239 era and update this note; that run
#   carries the one-time asterisk.
thresholds:
  technical-simplified:
    max_rate: 15.0
  plain-language:
    max_rate: 5.0
  classic-concise:
    max_rate: 10.0
  clarity-flow:
    max_rate: 5.0
  developer-docs:
    max_rate: 10.0
  actionable-clarity:
    max_rate: 5.0
  concise:
    max_rate: 5.0
