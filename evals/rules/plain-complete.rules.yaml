# Rule data for the plain-complete output style.
#
# The style file lives at plugin/output-styles/plain-complete.md.
#
# Documented exclusions. These rules of the style need judgment or work on
# the whole document, so the linter does not check them, and the fidelity
# score does not cover them: audience fit, answer-first organization, topic
# sentences, paragraph length, list and table choice, the goal before a
# procedure and the success statement after it, conditions before
# instructions, familiar words, filler words, jargon, hidden verbs, noun
# strings, the abbreviation budget per document, active voice, present
# tense, one idea per sentence, exceptions to exceptions, emphasis, ALL
# CAPS, link text, and the whole Completeness section: fact retention,
# hedge retention, self-contained statements, and the shortening re-check.
#
# The style permits contractions and the modal verbs "must", "may", and
# "should". "may" stays permitted on purpose, because it is also a hedge
# word and the style protects stated uncertainty. Thus the contraction,
# semicolon, and sentence-length checks stay off, and the modal ban covers
# only "shall". This rule set conflicts with the technical-simplified rule
# set on purpose.
#
# Format: see rules/technical-simplified.rules.yaml.

style: plain-complete

modals:
  banned: [shall]
  permitted: [must, may, should]

latin_abbreviations:
  - avoid: "e.g."
    write: "for example"
  - avoid: "i.e."
    write: "that is"
  - avoid: "etc."
    write: "and so on, or stop the list"
  - avoid: "et al."
    write: "and others"
  - avoid: "cf."
    write: "compare"
  - avoid: "viz."
    write: "namely"

patterns:
  - id: and-or
    regex: '\band/or\b'
    message: 'Do not write "and/or". Write "either X or Y, or both".'
  - id: double-negative
    regex: '\bno (?:fewer|less) than\b'
    message: 'Do not use a double negative. Write "at least".'
  - id: double-negative
    regex: '\bnot un(?:common|usual|likely)\b'
    message: 'Do not use a double negative. State the idea in positive form.'
